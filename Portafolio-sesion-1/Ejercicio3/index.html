<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Primer Asistente / Página Web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            transition: background 0.3s;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>¡Hola! Bienvenido a mi portafolio</h1>
        <p>Página web desarrollada con asistencia de IA para la Sesión 1.</p>
        <button id="miBoton" onclick="cambiarColor()">¡Haz clic aquí!</button>
    </div>

    <script>
        function cambiarColor() {
            const btn = document.getElementById('miBoton');
            if (btn.style.backgroundColor === 'rgb(40, 167, 69)') {
                btn.style.backgroundColor = '#007BFF';
                btn.textContent = '¡Haz clic aquí!';
            } else {
                btn.style.backgroundColor = '#28a745';
                btn.textContent = '¡Acción ejecutada!';
            }
        }
    </script>
</body>
</html>
